name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-enhanced.txt
      - run: python -m pip install -r requirements-enhanced.txt
      - run: python -m compileall -q app
      - run: python -m unittest test_quota_summary_data test_spring_motion test_status_reactions.SchedulerTests test_ring_metrics test_work_actions test_sustained_reactions test_soft_curves_navigation test_release_version test_app_updates
