name: Verified release transfer
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare temporary transfer tools
        run: npm install --prefix "$RUNNER_TEMP/bailong-relay" @actions/artifact@2.3.2
      - uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs=require('fs'),path=require('path'),crypto=require('crypto');
            const base=path.join(process.env.RUNNER_TEMP,'bailong-relay/node_modules');
            const {internalArtifactTwirpClient}=require(path.join(base,'@actions/artifact/lib/internal/shared/artifact-twirp-client.js'));
            const {getBackendIdsFromToken}=require(path.join(base,'@actions/artifact/lib/internal/shared/util.js'));
            const {DefaultArtifactClient}=require(path.join(base,'@actions/artifact'));
            const {BlobClient}=require(path.join(base,'@azure/storage-blob'));
            const client=internalArtifactTwirpClient(),ids=getBackendIdsFromToken(),artifacts=new DefaultArtifactClient();
            const name='bailong-release-transfer-072',asset='bailong-desktop-pet-0.7.2-windows-x64.zip';
            const expected='dd0eb2cce241bcdb82f29c5d14efc6ae6fcdb4d8160f10cc634cbfb740a8be28',size=1159879134;
            const created=await client.CreateArtifact({...ids,name,version:4});
            if(!created.ok)throw new Error('Transfer staging failed');
            core.setSecret(created.signedUploadUrl);
            const descriptor=path.join(process.env.RUNNER_TEMP,'transfer-channel.json');
            fs.writeFileSync(descriptor,JSON.stringify({url:created.signedUploadUrl,size,sha256:expected}));
            const channelName='bailong-transfer-channel-'+context.runId;
            const channel=await artifacts.uploadArtifact(channelName,[descriptor],process.env.RUNNER_TEMP,{retentionDays:1});
            const blob=new BlobClient(created.signedUploadUrl),deadline=Date.now()+150*60*1000;
            core.info('Transfer channel ready; waiting for verified complete package.');
            while(true){
              try{if((await blob.getProperties()).contentLength===size)break;}catch{}
              if(Date.now()>deadline)throw new Error('Transfer staging timed out');
              await new Promise(r=>setTimeout(r,10000));
            }
            const destination=path.join(process.env.RUNNER_TEMP,asset);await blob.downloadToFile(destination);
            const hash=crypto.createHash('sha256');for await(const chunk of fs.createReadStream(destination))hash.update(chunk);
            if(hash.digest('hex')!==expected)throw new Error('Staged package SHA-256 mismatch');
            const release=await github.rest.repos.getRelease({...context.repo,release_id:419240219});
            if(!release.data.draft||release.data.tag_name!=='v0.7.2')throw new Error('Unexpected release target');
            const old=await github.rest.repos.listReleaseAssets({...context.repo,release_id:419240219});
            for(const item of old.data.filter(x=>x.name===asset)){
              if(item.state!=='starter')throw new Error('Inspect existing asset before replacement');
              await github.rest.repos.deleteReleaseAsset({...context.repo,asset_id:item.id});
            }
            require('child_process').execFileSync('gh',['release','upload','v0.7.2',destination,'--repo',context.repo.owner+'/'+context.repo.repo],{stdio:'inherit',timeout:15*60*1000});
            const uploaded=(await github.rest.repos.listReleaseAssets({...context.repo,release_id:419240219})).data.find(x=>x.name===asset);
            if(!uploaded||uploaded.size!==size||uploaded.digest!=='sha256:'+expected)throw new Error('Release asset verification failed');
            const finalized=await client.FinalizeArtifact({...ids,name,size:String(size),hash:{value:'sha256:'+expected}});
            if(!finalized.ok)throw new Error('Transfer cleanup registration failed');
            await github.rest.actions.deleteArtifact({...context.repo,artifact_id:Number(finalized.artifactId)});
            await github.rest.actions.deleteArtifact({...context.repo,artifact_id:channel.id});
            fs.unlinkSync(descriptor);fs.unlinkSync(destination);
            core.info('Release ZIP uploaded and SHA-256 verified; temporary transfer artifacts deleted. Release remains a draft.');
