name: Publish HD materials
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Verified draft resource release ID
        required: true
      inputs_asset_id:
        description: SHA verified seam input asset ID
        required: true
      inputs_sha256:
        description: Expected seam ZIP SHA256
        required: true
      expected_archive_sha256:
        description: Canonical HD archive SHA256 from local assembly
        required: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
      INPUT_ASSET_ID: ${{ inputs.inputs_asset_id }}
      INPUT_SHA: ${{ inputs.inputs_sha256 }}
      EXPECTED_SHA: ${{ inputs.expected_archive_sha256 }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyInstaller==6.22.3
      - name: Validate draft and download verified inputs
        run: |
          python tools/publish_hd_resource.py prepare
      - name: Assemble and verify canonical HD archive
        run: |
          python tools/assemble_hd_release.py --base hd-work/base.zip --inputs hd-work/inputs.zip --out hd-output --work hd-work/extract
      - name: Verify upload and publish resource prerelease
        run: |
          python tools/publish_hd_resource.py publish
